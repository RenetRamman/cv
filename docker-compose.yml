services:
  postgres:
    image: postgres:16-alpine
    container_name: cv-postgres
    environment:
      POSTGRES_DB: cv
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
