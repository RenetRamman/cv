spring.application.name=cvbackend
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL connection (override via environment variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cv}
spring.datasource.username=${DB_USERNAME:cv}
spring.datasource.password=${DB_PASSWORD:cv}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
